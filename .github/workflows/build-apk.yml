name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Vérifier le kit Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer les modules
        run: npm install --no-audit --no-fund

      - name: Assembler le pont natif
        run: npm run bridge

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../garde-manger.apk

      - name: Garder l'APK dans le résultat de la compilation
        uses: actions/upload-artifact@v4
        with:
          name: garde-manger-apk
          path: garde-manger.apk

      - name: Publier l'APK (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Garde-manger (version ${{ github.run_number }})
          body: Télécharge garde-manger.apk depuis ton téléphone Android, puis ouvre-le pour l'installer.
          files: garde-manger.apk
          make_latest: true

  test:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: garde-manger-apk

      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'appli sur un téléphone virtuel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r garde-manger.apk
            adb logcat -c
            adb shell monkey -p com.gardemanger.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > ecran.png
            adb logcat -d > logcat-complet.txt || true

      - name: Filtrer les journaux
        if: always()
        run: grep -iE "Capacitor|chromium|AndroidRuntime|GM_ERROR|FATAL" logcat-complet.txt > journal.txt || echo "aucune ligne" > journal.txt

      - name: Publier le diagnostic
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diagnostic
          name: Diagnostic (dernier test sur émulateur)
          body: Capture d'écran et journaux du dernier test automatique. Pas une version à installer.
          prerelease: true
          make_latest: false
          files: |
            ecran.png
            journal.txt
